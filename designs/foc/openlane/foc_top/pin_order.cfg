# FOC Motor Coprocessor — Pin Ordering for OpenLane2
# ===================================================
# TODO: Update when RTL ports are finalized.
# Format: side pin_name_regex
#
# Sides: N (north), S (south), E (east), W (west)

# Clock and reset on west side
#BUS_SORT
W clk
W rst_n

# Current inputs (from ADC) on south side
S i_a.*
S i_b.*
S i_c.*

# Rotor angle input on south side
S theta.*

# Control inputs on west side
W start
W mode.*
W id_ref.*
W iq_ref.*

# PWM outputs on east side
E pwm_a.*
E pwm_b.*
E pwm_c.*

# Status outputs on north side
N done
N busy
